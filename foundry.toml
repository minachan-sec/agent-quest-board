[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# EVM Paris (pre-Cancun): OpenZeppelin's ReentrancyGuard then uses a regular
# storage slot instead of transient storage (EIP-1153), which keeps the
# contract compatible with every BSC node regardless of Cancun support.
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[invariant]
runs = 200
depth = 40

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
